name: Test Kick Lightweight

# Manual Trigger
on:
  workflow_dispatch:

jobs:
  debug_test:
    runs-on: ubuntu-latest

    steps:
      # 1. Code Download
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Python Setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Dependencies (Sirf standard requests, curl_cffi hata diya)
      - name: Install Dependencies
        run: |
          pip install requests urllib3

      # 4. Script Run
      - name: Run Debug Script
        run: python debug_kick.py
